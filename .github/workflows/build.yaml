name: Build app

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["*"]

permissions:
  contents: read

env:
  APP_PATH: "./syslog"
  CONTAINER_REGISTRY: "docker.io"

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
      image_tags: ${{ steps.normalize.outputs.image_tags }}
      publish: ${{ steps.normalize.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ${{ env.APP_PATH }}

      - name: Normalize information
        id: normalize
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_URL: ${{ steps.info.outputs.url }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # info helper returns JSON encoded values, e.g. "mib85/{arch}-ha-addon-syslog"
          image=$(jq -r . <<< "${INFO_IMAGE}")
          image_name=${image##*/}
          echo "image_name=${image_name#\{arch\}-}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${CONTAINER_REGISTRY}/${image%/*}" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r . <<< "${INFO_NAME}")" >> "$GITHUB_OUTPUT"
          echo "description=$(jq -r . <<< "${INFO_DESCRIPTION}")" >> "$GITHUB_OUTPUT"
          url=$(jq -r . <<< "${INFO_URL}")
          if [[ -n "${url}" && "${url}" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

          version=$(jq -r . <<< "${INFO_VERSION}")
          image_tags="${version}"
          publish=false
          if [[ "${EVENT_NAME}" == "push" ]]; then
            publish=true
            if [[ "${REF}" == "refs/heads/main" ]]; then
              # development build from main branch, don't touch "latest"
              version=dev
              image_tags=dev
            else
              # release build from tag
              image_tags=$(printf '%s\n%s' "${version}" latest)
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          {
            echo "image_tags<<EOF"
            echo "${image_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} syslog app
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # Needed for Cosign signing (issue OIDC token for signing)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build syslog app
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry: ${{ env.CONTAINER_REGISTRY }}
          container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
          context: ${{ env.APP_PATH }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ needs.prepare.outputs.publish }}
          skip-existing: ${{ startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.version || '' }}
          version: ${{ needs.prepare.outputs.version }}
